# 体检报告分析模型、菜品离线打标模型与上传路径的业务配置。
# OCR 已随纯图片链路整体退出（设计方案 §3.5），不再有任何 ocr.* 配置键。

# ---- 上传：multipart 限额 ----
# 单文件业务上限 20MiB；不写这两项时 Spring Boot 默认只有 1MB，
# FileUploadService 的大小校验将永远执行不到，超限会返回未定义的 500。
spring.servlet.multipart.max-file-size=20MB
# 请求体额外预留 multipart 边界与请求头开销。
spring.servlet.multipart.max-request-size=21MB

# ---- 任务执行线程池 ----
# C 与实例数必须按部署环境和模型服务配额调整；W 由配额与内存两个上界取小。
health-report.executor.model-concurrency-quota=16
health-report.executor.instance-count=1
health-report.executor.heap-budget-mb=2048
health-report.executor.web-reserved-mb=512
health-report.executor.task-peak-mb=256
health-report.executor.queue-capacity=8
health-report.executor.heartbeat-interval-seconds=30

# ---- 生命周期清理 ----
# 单轮候选上限。防的是故障放大：对象存储不可用时 task 行删不掉、候选无限增长，
# 而清理巡检正是唯一能恢复它的东西。有上限则退化为「每轮推进固定条数」。
health-report.cleanup.batch-size=500

# ---- 模型版本 ----
# 模型版本是部署参数；LLM-A 的 model 字段只引用这一处真源。
llm.model-version-extraction=${EXTRACTION_MODEL:}
# LLM-B 直连时它就是请求里的 model 字段；改变会触发全量重打标。
llm.model-version-dishtag=${DISHTAG_MODEL:}

# ---- 离线打标产能闸 ----
# 单企业单日最多参与打标的菜品数。超出部分【当天不打标】：既不进推荐集合，也不进过敏拒绝集合，
# 对模块四直接不存在（与设计方案 §8.9「未进入凌晨快照的菜品不会出现在任何集合中」同一种缺席）。
# 这是产能闸，不是分页参数；分页页容量是 dish.tag-query-page-size。
dish.tag-max-dishes-per-company=500

# ---- LLM-A 直连 ----
llm.extraction.base-url=${EXTRACTION_BASE_URL:}
llm.extraction.model=${llm.model-version-extraction}
# 仅允许由环境变量注入，代码库不保存真实凭证。
llm.extraction.api-key=${EXTRACTION_API_KEY:}

# ---- LLM-B 直连 ----
# 与体检报告分析模型是同一个网关同一套协议，模型标识复用上面的 llm.model-version-dishtag
# ——它同时是 tagHash 的输入，全案只有那一处真源。
llm.dishtag.base-url=${DISHTAG_BASE_URL:}
# 仅允许由环境变量注入，代码库不保存真实凭证。
llm.dishtag.api-key=${DISHTAG_API_KEY:}

# ---- HTTP 日志 ----
# 体检报告分析模型的请求含报告图像、响应含报告全文，
# 显式关闭 HTTP 正文可能经过的调试与 wire 日志。
# 注意：这几项是框架级开关，同样会盖住 LLM-B——而 LLM-B 的正文不含健康数据、
# 允许记录，它的正文日志走自己的 logger（见 OpenAiCompatibleDishTagClient），不受这里影响。
logging.level.org.springframework.web.client=INFO
logging.level.org.apache.http=INFO
logging.level.org.apache.http.wire=OFF
logging.level.org.apache.http.headers=OFF
logging.level.org.eclipse.jetty=INFO
logging.level.jdk.internal.httpclient=INFO

# ---- 隐私正文日志（默认关闭）----
# 模型响应正文、原始文件名、异常指标与过敏原等结构化健康内容
# 走 SensitiveLog 的独立 logger，级别固定为 DEBUG。
# 独立 logger 的意义：把 logging.level.com.example.healthreport 整体调成 DEBUG
# 不会顺带打开报告全文——想看必须显式改下面这一行。
# ⛔ 打开等于让报告原文落盘并被日志采集系统集中留存，绕过 §0.3-③ 对 MySQL 的约束。
#    仅限排障期临时打开，用完必须改回 OFF。
logging.level.HEALTH_REPORT_SENSITIVE=OFF
